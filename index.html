<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Atualizado</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 class="titulo">Calculadora Atualizado</h1>

    <div class="calculadora">
        <div class="display">
            <input type="text" id="resultado" readonly placeholder="0">
        </div>

        <div class="botoes-grid">
            <button class="operador btn-limpar">C</button>
            <button class="operador btn-deletar">DEL</button>
            <button class="operador">÷</button>
            <button class="operador">x</button>

            <button class="numero">7</button>
            <button class="numero">8</button>
            <button class="numero">9</button>
            <button class="operador">+</button>

            <button class="numero">4</button>
            <button class="numero">5</button>
            <button class="numero">6</button>
            <button class="operador">-</button>

            <button class="numero">1</button>
            <button class="numero">2</button>
            <button class="numero">3</button>
            <button class="operador btn-igual">=</button>

            <button class="numero btn-zero-expand">0</button>
            <button class="numero">.</button>
            </div>
        </div>

    <p class="assinatura">
        Baseado no projeto de Gabriel Allan Ribeiro da Silva © 2024.
    </p>

    <script src="script.js"></script>
</body>
</html>
